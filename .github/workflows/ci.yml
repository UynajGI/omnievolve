name: OmniEvolve CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install commitizen

      - name: Check commit messages
        run: |
          errors=0
          while IFS= read -r sha; do
            msg=$(git log -1 --format='%s' "$sha")
            # 跳过 merge commit
            echo "$msg" | grep -qE '^Merge ' && continue
            echo "$msg" | cz check --commit-msg-file /dev/stdin || errors=$((errors + 1))
          done <<< "$(git rev-list origin/${{ github.base_ref }}..HEAD)"
          [ "$errors" -eq 0 ] || exit 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('pyproject.toml') }}

      - run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff check
        run: ruff check src/omnievolve/ tests/

      - name: Ruff format check
        run: ruff format --check src/omnievolve/ tests/

      - name: Mypy
        run: mypy src/omnievolve/

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[docker]"
          pip install pytest pytest-cov hypothesis

      - name: Pytest + Coverage
        run: pytest -q --cov=omnievolve --cov-report=term-missing --cov-report=xml -m "not llm and not slow and not benchmark"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          file: coverage.xml
          flags: py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-integ-${{ hashFiles('pyproject.toml') }}

      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[docker]"
          pip install pytest hypothesis

      - name: Slow & E2E tests
        run: pytest -q -m "slow or e2e"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: omnievolve/sandbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: docker run --rm omnievolve/sandbox:latest python -c "print('OK')"
