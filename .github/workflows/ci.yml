name: OmniEvolve CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docker]"
          pip install ruff pytest mypy

      - name: Ruff lint
        run: ruff check src/omnievolve/ tests/

      - name: Mypy type check
        run: python -m mypy src/omnievolve/ --ignore-missing-imports

      - name: Pytest
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build sandbox image
        run: docker build -t omnievolve/sandbox:latest .
      - name: Verify image
        run: docker run --rm omnievolve/sandbox:latest python -c "print('OK')"
