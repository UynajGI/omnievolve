name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/code-review.yml"

# 安全基线：默认只读；仅评论 job 提权到 pull-requests: write。
permissions:
  contents: read

concurrency:
  group: review-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 仅同仓库分支运行：外部 fork 的 PR 不执行（避免不可信代码 + 密钥组合）。
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    # advisory：AI 供应商超时/限流不阻塞合并（安全/配置错误仍可观测）。
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Claude Code Review
        # 模型密钥缺失时安全跳过（secrets 不能直接用于 if，经 env 注入判断）。
        if: env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: claude-sonnet-4-20250514
          max_tokens: 4096
