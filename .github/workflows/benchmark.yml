name: Performance Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 安全基线：PR 只读；仅 main baseline 更新 job 提权到 contents: write。
permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  benchmark-report:
    # PR 只读报告：不修改 gh-pages 基线，只产出原始结果供人工/检查消费。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # latest
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync frozen environment
        run: uv sync --frozen --extra docker
      - name: Run benchmarks
        run: uv run --frozen pytest tests/ --benchmark-only --benchmark-json=benchmark-output.json -q -m benchmark
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: benchmark-output.json
          retention-days: 14

  benchmark-baseline:
    # main/scheduled：更新 gh-pages 历史基线（唯一写权限 job）。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # benchmark-action auto-push to gh-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # latest
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync frozen environment
        run: uv sync --frozen --extra docker
      - name: Run benchmarks
        run: uv run --frozen pytest tests/ --benchmark-only --benchmark-json=benchmark-output.json -q -m benchmark
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: pytest
          output-file-path: benchmark-output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # GitHub-hosted runner 噪声大：阈值与 fail-on-alert 定位为
          # 粗粒度回归检测，不作为精密性能研究门禁。
          alert-threshold: "200%"
          fail-on-alert: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: benchmark-output.json
          retention-days: 14
