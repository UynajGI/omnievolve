name: Performance Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # benchmark-action auto-push to gh-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-bench-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docker]"
          pip install pytest pytest-benchmark hypothesis

      - name: Run benchmarks
        run: pytest tests/ --benchmark-only --benchmark-json=benchmark-output.json -q -m benchmark

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: pytest
          output-file-path: benchmark-output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          alert-threshold: "150%"
          fail-on-alert: true
          skip-fetch-gh-pages: true

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-output.json
