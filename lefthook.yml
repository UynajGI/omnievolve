# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json

pre-commit:
  parallel: true
  commands:
    ruff:
      glob: "*.py"
      run: ~/.local/bin/uv run ruff check --fix {staged_files}
      stage_fixed: true
    ruff-format:
      glob: "*.py"
      run: ~/.local/bin/uv run ruff format {staged_files}
      stage_fixed: true

pre-push:
  parallel: false
  commands:
    test:
      run: ~/.local/bin/uv run pytest tests/ -v
