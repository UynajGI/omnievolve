# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json

min_version: "1.5.0"
colors: true

# pre-commit：只做快速写操作（Ruff），且必须严格顺序。
# 两个写命令（check --fix 与 format）并行会竞态改写同一批 staged 文件，
# 并各自 stage_fixed 造成非确定性——合并为单一顺序 pipeline：
# check/fix → format → 两步都成功后才重新暂存。
pre-commit:
  parallel: true
  commands:
    ruff:
      glob: "*.py"
      run: uv run --frozen ruff check --fix {staged_files} && uv run --frozen ruff format {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    conventional:
      run: uv run --frozen cz check --commit-msg-file {1}

pre-push:
  parallel: false
  commands:
    lock-check:
      # 本地 pyproject 与 uv.lock 不一致时快速失败，避免拖到 CI。
      run: uv lock --check
    type-check:
      run: uv run --frozen mypy src/omnievolve/
    test:
      # 与 CI fast 集合语义一致（fast = not llm and not llm_smoke and not slow
      # and not e2e and not benchmark）。带引号的 -m 表达式放在脚本文件里：
      # lefthook 会剥掉 run 字符串中的引号并按空格分词（shell 无法挽救），
      # 而 bash 执行脚本文件时内部引号原样保留。
      run: bash scripts/pre_push_tests.sh
