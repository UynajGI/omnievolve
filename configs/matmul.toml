# OmniEvolve — matmul 矩阵乘法张量分解任务
# 用法: omnievolve run ... -c configs/matmul.toml --no-self-evolve

[evolution]
max_generations = 20
population_size = 4
island_count = 2
novelty_threshold = 0.92
novelty_retry_limit = 3
mutation_rate = 0.3
crossover_rate = 0.15
max_stagnation_gens = 5
token_budget = 4_000_000
compute_budget_sec = 0
sandbox_timeout = 300
sandbox_mem_limit_mb = 16384  # JAX/XLA 需要大虚拟地址空间
health_window_gens = 5
self_evolve_enabled = false  # 先关闭 Slow Loop，纯测 Fast Loop

[selection]
parent_selector = "lineage_ucb"
tournament_size = 3
pareto_enabled = true
island_migration_interval = 5

[models]
heavy = ["deepseek/deepseek-v4-flash"]
light = ["deepseek/deepseek-v4-flash"]

[models.routing]
algorithm = "sliding_window_ucb"
window_size = 50
ucb_c = 1.414
cost_weight = 0.2
latency_weight = 0.1
role_conditioned = true

[embedding.code]
provider = "local"
model = "Qwen/Qwen3-Embedding-0.6B"
revision = "default"
dimension = 1024
normalization = "provider_default"
input_type = "document"

[embedding.thought]
provider = "local"
model = "Qwen/Qwen3-Embedding-0.6B"
revision = "default"
dimension = 1024
normalization = "l2"
input_type = "document"

[novelty]
embedding_gate = true
ast_gate = true
behavior_gate = false
llm_judge_on_borderline = true
borderline_low = 0.88
borderline_high = 0.96

[sandbox]
backend = "trusted_subprocess"   # 开发阶段用本地，正式切 docker
timeout_sec = 120               # JAX 80k 步优化，需要较长超时
mem_limit_mb = 2048
cpu_limit = 4.0
pids_limit = 64
network_mode = "none"
read_only_root = false          # JAX 需要写缓存
run_as_non_root = true
drop_capabilities = true
no_new_privileges = true
language = "python"

[storage]
db_path = ".omnievolve/matmul.db"
vector_dir = ".omnievolve/vectors"
artifact_dir = ".omnievolve/artifacts"
export_dir = ".omnievolve/exports"

[storage.jobs]
lease_sec = 120
heartbeat_sec = 20
max_attempts = 3

[memory]
default_top_k = 8
scope_weights = { L0 = 1.0, L1 = 0.9, L2 = 0.6, L3 = 0.4, L4 = 0.2 }
ablation_interval_gens = 10

[self_evaluator]
roi_warn_threshold = 0.001
entropy_warn_threshold = 0.35
stagnation_trigger = 3
window_gens = 3
require_confidence_interval = true

[meta_evolution]
enabled = false                 # 关闭 Slow Loop
prompt_mutation_rate = 0.2
meta_canary_budget_ratio = 0.1
promotion_min_gain = 0.02
promotion_max_regression = 0.005
require_replay_for_l1 = true
auto_apply_l0 = true
allow_l2_actions = false

[evaluation_governance]
immutable_task_semantics = true
immutable_correctness_tests = true
immutable_hidden_data = true
immutable_score_formula = true
allow_environment_adaptation = true
require_baseline_recheck = true
require_elite_rank_stability = true
