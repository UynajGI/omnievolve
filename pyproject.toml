[project]
name = "omnievolve"
version = "0.1.0"
description = "OmniEvolve - 受控元进化框架 (Controlled Meta-Evolution Framework)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.40",
    "networkx>=3.2",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "typer>=0.9",
    "rich>=13.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
vector = ["zvec>=0.3"]
local-embed = ["sentence-transformers>=2.3"]
docker = ["docker>=7.0"]
viz = ["pyvis>=0.3"]
tuning = ["optuna>=3.6"]

[project.scripts]
omnievolve = "omnievolve.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.5",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "marker-pdf>=1.6.1",
    "pymupdf>=1.28.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.sql", "*.yml", "*.yaml", "*.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "UP046"]  # E501: 行长度对 SQL 不实用; UP046: Generic[T] 更兼容

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
