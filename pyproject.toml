[project]
name = "omnievolve"
version = "0.2.0"
description = "OmniEvolve - 受控元进化框架 (Controlled Meta-Evolution Framework)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.40",
    "networkx>=3.2",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "typer>=0.9",
    "rich>=13.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
vector = ["zvec>=0.3"]
local-embed = ["sentence-transformers>=2.3"]
docker = ["docker>=7.0"]
monty = ["pydantic-monty>=0.0.18"]
viz = ["pyvis>=0.3"]
tuning = ["optuna>=3.6"]
all = [
    "omnievolve[vector,local-embed,docker,monty,viz,tuning]",
]

[project.scripts]
omnievolve = "omnievolve.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.5",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "structlog>=24.0",
    "mypy>=1.10",
    "marker-pdf>=1.6.1",
    "pymupdf>=1.28.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.sql", "*.yml", "*.yaml", "*.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "UP046", "UP042", "N806", "N803"]  # NetworkX 惯例使用 G 变量名

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "unit: 纯单元测试，不依赖外部服务",
    "integration: 集成测试，需要真实数据库/文件系统",
    "llm: 需要 LLM API 调用（需要 secrets）",
    "llm_smoke: LLM 烟雾测试 — 2-3代真实进化，验证管线连通性（Tier 2）",
    "slow: 运行时间 > 5 秒的性能/soak 测试",
    "e2e: 端到端全管线测试（含 fake LLM）",
    "benchmark: 性能基准/回归测试",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
